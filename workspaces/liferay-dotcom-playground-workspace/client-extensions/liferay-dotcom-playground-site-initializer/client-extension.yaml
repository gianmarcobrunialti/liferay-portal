liferay-dotcom-playground-site-initializer:
    name: Liferay Dotcom Playground Site Initializer
    oAuthApplicationHeadlessServer: liferay-dotcom-playground-site-initializer-oahs
    siteExternalReferenceCode: liferayDotcomPlaygroundReference
    siteName: Liferay Dotcom Playground (Reference)
    type: siteInitializer
liferay-dotcom-playground-site-initializer-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Liferay Dotcom Playground Site Initializer OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Admin.List.Type.everything
        -   Liferay.Headless.Admin.Site.everything
        -   Liferay.Headless.Admin.Taxonomy.everything
        -   Liferay.Headless.Admin.User.everything
        -   Liferay.Headless.Delivery.everything
        -   Liferay.Headless.Site.everything
    type: oAuthApplicationHeadlessServer
