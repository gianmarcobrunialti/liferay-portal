<section class="playground-quota" data-site-id="${themeDisplay.getScopeGroupId()}">
	<h2 class="playground-quota__title">Usage</h2>
	<div class="playground-quota__items">
		<div class="playground-quota-gauge" data-resource="pages" data-limit="20">
			<div class="playground-quota-gauge__label">Pages</div>
			<div class="playground-quota-gauge__value">&mdash; / 20</div>
			<div class="playground-quota-gauge__bar"><div class="playground-quota-gauge__bar-fill"></div></div>
		</div>
		<div class="playground-quota-gauge" data-resource="articles" data-limit="20">
			<div class="playground-quota-gauge__label">Articles</div>
			<div class="playground-quota-gauge__value">&mdash; / 20</div>
			<div class="playground-quota-gauge__bar"><div class="playground-quota-gauge__bar-fill"></div></div>
		</div>
		<div class="playground-quota-gauge" data-resource="storage" data-limit="100">
			<div class="playground-quota-gauge__label">Storage (MB)</div>
			<div class="playground-quota-gauge__value">&mdash; / 100</div>
			<div class="playground-quota-gauge__bar"><div class="playground-quota-gauge__bar-fill"></div></div>
		</div>
	</div>
</section>
